name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
        if: matrix.os == 'ubuntu-latest'
      - run: npm run test:desktop
        if: matrix.os == 'ubuntu-latest'
      - name: Run Electron main-process E2E (Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run --auto-servernum -- npm run test:electron
      - run: npm audit --omit=dev --audit-level=high
        if: matrix.os == 'ubuntu-latest'

  golden-hashes:
    name: Cross-OS golden hash verification
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install jsonlite
        run: Rscript -e 'install.packages("jsonlite", repos = "https://cloud.r-project.org")'
      - run: npm ci
      - run: npm run golden:tier0
      - run: npm run golden:tier1a
