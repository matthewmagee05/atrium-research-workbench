id: deterministic-dedupe
version: 1.0.0
name: Deterministic Dedupe
description: Removes duplicate normalized records using DOI and normalized title keys.
stage: dedupe
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs:
  - name: normalized
    schema: schemas/input.json
    optional: false
outputs:
  - name: deduped
    schema: schemas/output.json
    description: Deduplicated normalized records.
    output_kind: structured_data
  - name: corpus_lock
    schema: schemas/corpus_lock.json
    description: Corpus lock for analyzed records.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: false
  budget:
    max_tokens_per_run: 0
    max_calls_per_run: 0
    max_cost_usd_per_run: 0
  prompts: []
determinism:
  level: deterministic
  guarantee: Stable DOI/title key selection over sorted records.
  variance_sources: []
  reproduction_metrics:
    - schema_validity
    - row_count_agreement
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
human_in_the_loop:
  enabled: false
  triggers: []
author: Research Workbench
license: MIT
documentation_url: ""
