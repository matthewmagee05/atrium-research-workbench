id: citation-export
version: 0.1.0
name: Citation Export
description: Exports included records as BibTeX and RIS text.
stage: report
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs:
  - name: records
    schema: schemas/records.json
outputs:
  - name: citations
    schema: schemas/citations.json
    description: BibTeX and RIS citation exports.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: false
  budget: {max_tokens_per_run: 0, max_calls_per_run: 0, max_cost_usd_per_run: 0}
  prompts: []
determinism:
  level: deterministic
  guarantee: Citation strings are generated from normalized record fields.
  variance_sources: []
  reproduction_metrics: [schema_validity, row_count_agreement]
human_in_the_loop:
  enabled: false
  triggers: []
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: ""
