id: llm-screener
version: 0.1.0
name: LLM Screener
description: Tier 2 contract for bounded LLM-assisted title/abstract screening with human adjudication.
stage: screen
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs:
  - name: records
    schema: schemas/records.json
    optional: false
outputs:
  - name: screening_decisions
    schema: schemas/screening_decisions.json
    description: Structured inclusion/exclusion recommendations.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: true
  budget:
    max_tokens_per_run: 100000
    max_calls_per_run: 1000
    max_cost_usd_per_run: 10
  prompts:
    - id: screening_v1
      path: prompts/screening.md
      version: 1.0.0
determinism:
  level: replayable
  guarantee: Original LLM recommendations are canonical; human decisions are authoritative.
  variance_sources: [model_version, sampling]
  reproduction_metrics: [schema_validity, decision_agreement_rate]
human_in_the_loop:
  enabled: true
  triggers: [low_confidence, disagreement, explicit_review_flag]
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: ""
