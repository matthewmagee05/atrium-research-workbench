id: risk-of-bias
version: 0.1.0
name: Risk of Bias
description: Produces structured RoB 2 / ROBINS-I style risk-of-bias judgements requiring human review.
stage: review
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs:
  - name: extractions
    schema: schemas/extractions.json
outputs:
  - name: rob_assessments
    schema: schemas/rob_assessments.json
    description: Domain-level and overall risk-of-bias judgements.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: false
  budget: {max_tokens_per_run: 0, max_calls_per_run: 0, max_cost_usd_per_run: 0}
  prompts: []
determinism:
  level: replayable
  guarantee: Auto-scores are suggestions; human decisions are authoritative on replay.
  variance_sources: [human_review]
  reproduction_metrics: [schema_validity, decision_agreement_rate]
human_in_the_loop:
  enabled: true
  triggers: [explicit_review_flag]
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: https://methods.cochrane.org/bias/resources/rob-2-revised-cochrane-risk-bias-tool-randomized-trials
