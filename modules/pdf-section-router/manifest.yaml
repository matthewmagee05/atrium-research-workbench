id: pdf-section-router
version: 0.1.0
name: PDF Section Router
description: Extracts named Methods, Results, and Discussion sections from TEI documents.
stage: extract
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs:
  - name: tei_documents
    schema: schemas/tei_documents.json
outputs:
  - name: sections
    schema: schemas/sections.json
    description: Routed full-text sections by record.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: false
  budget: {max_tokens_per_run: 0, max_calls_per_run: 0, max_cost_usd_per_run: 0}
  prompts: []
determinism:
  level: deterministic
  guarantee: Routes existing TEI sections by normalized headings.
  variance_sources: []
  reproduction_metrics: [schema_validity, row_count_agreement]
human_in_the_loop:
  enabled: false
  triggers: []
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: ""
