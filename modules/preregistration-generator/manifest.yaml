id: preregistration-generator
version: 0.1.0
name: Preregistration Generator
description: Tier 4 contract for generating preregistration drafts from reviewed hypotheses.
stage: report
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs:
  - name: hypotheses
    schema: schemas/hypotheses.json
    optional: false
outputs:
  - name: preregistration
    schema: schemas/preregistration.json
    description: Preregistration draft.
    output_kind: report_text
params_schema: schemas/params.json
llm:
  required: true
  budget: {max_tokens_per_run: 30000, max_calls_per_run: 10, max_cost_usd_per_run: 5}
  prompts: [{id: preregistration_v1, path: prompts/preregistration.md, version: 1.0.0}]
determinism:
  level: replayable
  guarantee: Draft text is a recommendation requiring researcher approval.
  variance_sources: [model_version, sampling]
  reproduction_metrics: [schema_validity]
human_in_the_loop: {enabled: true, triggers: [explicit_review_flag]}
side_effects: {network: false, network_domains: [], filesystem_write: true, external_processes: false}
author: Research Workbench
license: MIT
documentation_url: ""
