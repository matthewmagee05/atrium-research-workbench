id: pdf-fetcher
version: 0.1.0
name: PDF Fetcher
description: Downloads open-access PDFs into a local cache and emits a reproducible PDF manifest.
stage: data-fetch
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs:
  - name: full_text_links
    schema: schemas/full_text_links.json
outputs:
  - name: pdf_manifest
    schema: schemas/pdf_manifest.json
    description: Cached PDF file paths and retrieval metadata.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: false
  budget: {max_tokens_per_run: 0, max_calls_per_run: 0, max_cost_usd_per_run: 0}
  prompts: []
determinism:
  level: volatile
  guarantee: Fixture and snapshot modes are deterministic; live_archived downloads only open-access PDFs and records retrieval metadata.
  variance_sources: [external_file_state]
  reproduction_metrics: [schema_validity, row_count_agreement]
human_in_the_loop:
  enabled: false
  triggers: []
side_effects:
  network: true
  network_domains: ["*"]
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: ""
