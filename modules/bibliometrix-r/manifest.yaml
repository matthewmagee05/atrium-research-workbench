id: bibliometrix-r
version: 1.0.0
name: Bibliometrix R
description: Produces bibliometric summary artifacts from a deduplicated corpus.
stage: analyze
runtime: r
entry: entry.R
runtime_version: ">=4.3"
dependencies:
  r: DESCRIPTION
inputs:
  - name: deduped
    schema: schemas/input.json
    optional: false
  - name: corpus_lock
    schema: schemas/corpus_lock.json
    optional: false
outputs:
  - name: summary
    schema: schemas/summary.json
    description: Bibliometric summary.
    output_kind: structured_data
  - name: tables
    schema: schemas/tables.json
    description: Bibliometric tables represented as structured JSON.
    output_kind: structured_data
  - name: figure_specs
    schema: schemas/figure_specs.json
    description: Canonical figure specifications.
    output_kind: figure_spec
  - name: rendered_figures
    schema: schemas/rendered_figures.json
    description: Informational SVG renderings.
    output_kind: rendered_figure
params_schema: schemas/params.json
llm:
  required: false
  budget:
    max_tokens_per_run: 0
    max_calls_per_run: 0
    max_cost_usd_per_run: 0
  prompts: []
determinism:
  level: deterministic
  guarantee: Pure R aggregation over canonical JSON input.
  variance_sources:
    - optional_graphics_device_metadata
  reproduction_metrics:
    - schema_validity
    - row_count_agreement
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
human_in_the_loop:
  enabled: false
  triggers: []
author: Research Workbench
license: MIT
documentation_url: https://www.bibliometrix.org/
