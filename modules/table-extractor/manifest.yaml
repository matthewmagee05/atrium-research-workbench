id: table-extractor
version: 0.1.0
name: Table Extractor
description: Extracts structured table-like rows from routed PDF sections.
stage: extract
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs:
  - name: sections
    schema: schemas/sections.json
outputs:
  - name: tables
    schema: schemas/tables.json
    description: Extracted table candidates from full text.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: false
  budget: {max_tokens_per_run: 0, max_calls_per_run: 0, max_cost_usd_per_run: 0}
  prompts: []
determinism:
  level: replayable
  guarantee: Rule-based fixture extraction is deterministic; future LLM-assisted extraction is replayable.
  variance_sources: [llm_extraction]
  reproduction_metrics: [schema_validity, field_agreement_rate]
human_in_the_loop:
  enabled: true
  triggers: [explicit_review_flag]
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: ""
