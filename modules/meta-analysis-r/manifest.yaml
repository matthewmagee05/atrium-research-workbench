id: meta-analysis-r
version: 0.1.0
name: Meta-analysis R
description: Computes pairwise random-effects meta-analysis statistics and a forest-plot specification.
stage: analyze
runtime: r
entry: entry.R
runtime_version: ">=4.3"
dependencies:
  r: DESCRIPTION
inputs:
  - name: effects
    schema: schemas/effects.json
outputs:
  - name: meta_summary
    schema: schemas/meta_summary.json
    description: Pooled effect, heterogeneity, and prediction interval.
    output_kind: structured_data
  - name: forest_plot_spec
    schema: schemas/forest_plot_spec.json
    description: Canonical figure spec for forest plot rendering.
    output_kind: figure_spec
params_schema: schemas/params.json
llm:
  required: false
  budget: {max_tokens_per_run: 0, max_calls_per_run: 0, max_cost_usd_per_run: 0}
  prompts: []
determinism:
  level: deterministic
  guarantee: Base-R implementation is deterministic; optional metafor use must be locked with renv in production.
  variance_sources: [r_package_version]
  reproduction_metrics: [schema_validity, distribution_distance]
human_in_the_loop:
  enabled: false
  triggers: []
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: https://wviechtb.github.io/metafor/
