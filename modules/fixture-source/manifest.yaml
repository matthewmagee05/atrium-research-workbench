id: fixture-source
version: 1.0.0
name: Fixture Source
description: Reads a bundled fixture corpus.
stage: source
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs: []
outputs:
  - name: records
    schema: schemas/output.json
    description: Raw fixture records.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: false
  budget:
    max_tokens_per_run: 0
    max_calls_per_run: 0
    max_cost_usd_per_run: 0
  prompts: []
determinism:
  level: deterministic
  guarantee: Fixture bytes are read from the repository.
  variance_sources: []
  reproduction_metrics:
    - schema_validity
    - row_count_agreement
human_in_the_loop:
  enabled: false
  triggers: []
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: ""
