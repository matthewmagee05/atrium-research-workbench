id: meta-regression-r
version: 0.1.0
name: Meta-regression R
description: Runs a deterministic fixture-safe weighted meta-regression over effect-size rows.
stage: analyze
runtime: r
entry: entry.R
runtime_version: ">=4.3"
dependencies:
  r: DESCRIPTION
inputs:
  - name: effects
    schema: schemas/effects.json
outputs:
  - name: meta_regression
    schema: schemas/meta_regression.json
    description: Meta-regression coefficients.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: false
  budget: {max_tokens_per_run: 0, max_calls_per_run: 0, max_cost_usd_per_run: 0}
  prompts: []
determinism:
  level: deterministic
  guarantee: Fixture and snapshot modes are deterministic; live modes archive raw requests and responses when applicable.
  variance_sources: []
  reproduction_metrics: [schema_validity, row_count_agreement]
human_in_the_loop:
  enabled: false
  triggers: []
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: 

