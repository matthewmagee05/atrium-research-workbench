id: prospero-source
version: 0.1.0
name: PROSPERO Source
description: Imports a PROSPERO registration snapshot or live record metadata when provided.
stage: source
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs: []
outputs:
  - name: registration
    schema: schemas/registration.json
    description: Registration metadata.
    output_kind: structured_data
params_schema: schemas/params.json
llm:
  required: false
  budget: {max_tokens_per_run: 0, max_calls_per_run: 0, max_cost_usd_per_run: 0}
  prompts: []
determinism:
  level: deterministic
  guarantee: Fixture and snapshot modes are deterministic; live modes archive raw requests and responses when applicable.
  variance_sources: [external_api_state]
  reproduction_metrics: [schema_validity, row_count_agreement]
human_in_the_loop:
  enabled: false
  triggers: []
side_effects:
  network: true
  network_domains: [www.crd.york.ac.uk]
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: 

