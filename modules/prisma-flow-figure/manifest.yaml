id: prisma-flow-figure
version: 0.1.0
name: PRISMA Flow Figure
description: Renders a PRISMA flow data object into deterministic SVG/PDF-ready figure markup.
stage: report
runtime: python
entry: entry.py
runtime_version: ">=3.11"
dependencies:
  python: requirements.txt
inputs:
  - name: prisma_flow
    schema: schemas/prisma_flow.json
outputs:
  - name: prisma_flow_figure
    schema: schemas/figure.json
    description: PRISMA flow figure SVG and figure spec.
    output_kind: figure_spec
params_schema: schemas/params.json
llm:
  required: false
  budget: {max_tokens_per_run: 0, max_calls_per_run: 0, max_cost_usd_per_run: 0}
  prompts: []
determinism:
  level: deterministic
  guarantee: SVG markup is generated from structured counts only.
  variance_sources: []
  reproduction_metrics: [schema_validity]
human_in_the_loop:
  enabled: false
  triggers: []
side_effects:
  network: false
  network_domains: []
  filesystem_write: true
  external_processes: false
author: Research Workbench
license: MIT
documentation_url: https://www.prisma-statement.org/prisma-2020-flow-diagram
